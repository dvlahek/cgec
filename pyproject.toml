[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cgec-reproducibility"
version = "0.1.0"
description = "Numerical checks and research materials for graph-evidence classification"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=1.5", "scipy>=1.10", "matplotlib>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
